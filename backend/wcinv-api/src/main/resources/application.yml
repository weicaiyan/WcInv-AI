server:
  port: 8080

spring:
  application:
    name: wcinv
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wcinv?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai}
    username: overduefree
    password: overduefree_pwd
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32chars-min}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}
